<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
:root { --bg:#0f0f0f; --card:#1c1c1e; --muted:#9a9aa0; --accent:#ff0033; --accent2:#7c3aed; --ok:#22c55e; }
* { box-sizing: border-box; }
body { width: 380px; margin:0; font-family: Inter, Segoe UI, Roboto, sans-serif; background: #fff; color:#111; }
.header { background: linear-gradient(135deg,#ff0033,#7c3aed); color:#fff; padding:14px 16px; }
.header h2 { margin:0; font-size:16px; font-weight:700; }
.header p { margin:2px 0 0; font-size:11px; opacity:.9; }
.wrap { padding:12px 14px 14px; }
.urlrow { display:flex; gap:6px; }
input#url { flex:1; padding:9px 10px; border:1px solid #e2e2e6; border-radius:10px; font-size:12px; }
button { border:0; border-radius:10px; padding:9px 10px; font-weight:600; cursor:pointer; font-size:13px; }
.btn-primary { background:#111; color:#fff; width:100%; margin-top:8px; }
.btn-primary:hover { background:#000; }
.btn-ghost { background:#f2f2f5; color:#111; display:inline-flex; align-items:center; gap:6px; }
.btn-ghost img { width:16px; height:16px; }
.btn-row { display:flex; gap:8px; margin-top:8px; }
.btn-row button { flex:1; }
#cancelBtn { background:#fee2e2; color:#b91c1c; display:none; }
#pauseBtn { background:#ede9fe; color:#5b21b6; display:none; }
.video { display:none; gap:10px; margin-top:10px; background:#f8f8fa; border:1px solid #eee; border-radius:12px; padding:8px; }
.video img { width:112px; height:63px; object-fit:cover; border-radius:8px; background:#ddd; }
.video .t { font-size:12px; font-weight:700; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.video .m { font-size:11px; color:#666; margin-top:4px; }
#qlist { margin-top:10px; max-height:180px; overflow:auto; display:flex; flex-direction:column; gap:6px; }
.q { display:flex; align-items:center; gap:8px; border:1px solid #e8e8ec; border-radius:10px; padding:8px 10px; cursor:pointer; font-size:12px; }
.q:hover { border-color:#111; }
.q.sel { border-color:#111; background:#111; color:#fff; }
.q.sel .size { background:#fff; color:#111; }
.q input { accent-color:#111; }
.q .lbl { flex:1; font-weight:600; }
.size { font-size:11px; background:#f2f2f5; padding:2px 8px; border-radius:20px; white-space:nowrap; }
.q.sel .size { background:#fff; }
#barWrap { height:10px; background:#eee; border-radius:20px; overflow:hidden; margin-top:10px; display:none; }
#bar { height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .25s; }
#meta { font-size:11px; color:#555; margin-top:6px; white-space:pre-wrap; }
#status { font-size:12px; margin-top:6px; min-height:16px; }
.badge { display:inline-block; font-size:10px; padding:2px 7px; border-radius:20px; background:#eef2ff; color:#4338ca; font-weight:700; }
.footer { font-size:10px; color:#888; margin-top:8px; }
</style>
</head>
<body>
<div class="header"><h2>◉ Personal Saver</h2><p>Highest quality merge • local only</p></div>
<div class="wrap">
  <div class="urlrow">
    <input id="url" placeholder="Paste YouTube URL…" />
    <button id="thumbBtn" class="btn-ghost" style="width:auto" title="Download highest-quality JPG thumbnail as Thumbnail-{VideoID}.jpg (no server needed)"><img src="icons/graphic-style.svg" alt="" />Thumb</button>
  </div>
  <div id="video" class="video" title="Click thumbnail to download HD">
    <img id="thumb" style="cursor:pointer" />
    <div><div id="vtitle" class="t"></div><div id="vmeta" class="m"></div></div>
  </div>
  <div id="qlist"></div>
  <button id="dlBtn" class="btn-primary">⬇ Download</button>
  <div class="btn-row">
    <button id="pauseBtn">⏸ Pause</button>
    <button id="cancelBtn">✕ Cancel</button>
  </div>
  <div id="barWrap"><div id="bar"></div></div>
  <div id="meta"></div>
  <div id="status"></div>
  <div class="footer">Video needs <b>python server.py</b> on 127.0.0.1:8000 • Thumb works without server • Own / CC content only</div>
</div>
<script src="popup.js"></script>
</body>
</html>
